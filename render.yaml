services:
  - type: web
    name: codetrack
    runtime: node
    plan: free
    buildCommand: npm ci && npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        generateValue: true
